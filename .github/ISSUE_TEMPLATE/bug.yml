name: Bug report
description: Report a reproducible SyncAndRun desktop problem
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic names and data. Do not attach music, credentials, or a profile.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: App version or commit, operating system, transfer method, and watch model if relevant.
