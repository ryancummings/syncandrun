[extend]
useDefault = true

[[allowlists]]
description = "Synthetic test credentials only"
regexTarget = "match"
regexes = [
  '''operator-secret-with-at-least-32-bytes''',
  '''different-operator-secret-at-least-32''',
  '''sanitized-plex-token-value''',
]

[[allowlists]]
description = "Electron asar byte boundaries create false positives; staged source and extracted files scan clean."
paths = ['''^desktop/release/[^/]+/resources/app\.asar$''']
